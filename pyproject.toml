[project]
name = "secure-but-broken"
version = "0.0.1"
description = "Deployment-validated evaluation of LLM security repairs for Kubernetes"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "pydantic>=2.7",
  "pyyaml>=6.0.3",
  "scipy>=1.18.1",
  "typer>=0.12",
]

[dependency-groups]
analysis = [
    "matplotlib>=3.11.2",
    "pypdf>=6.21.0",
    "python-docx>=1.2.0",
    "statsmodels>=0.15.0",
]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/src/harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
